
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Cinzel:wght@600&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      .font-title {
        font-family: 'Cinzel', serif;
      }

      /* Card Glitch Animations */
      @keyframes glitch-line {
        0% { transform: translateY(-50px); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes glitch-text {
        0% { transform: translate(0) skew(0deg); }
        15% { transform: translate(-3px, 1px) skew(-5deg); }
        30% { transform: translate(1px, -2px) skew(2deg); }
        45% { transform: translate(-2px, -1px) skew(-2deg); }
        60% { transform: translate(3px, 3px) skew(6deg); }
        75% { transform: translate(-1px, 2px) skew(-3deg); }
        90% { transform: translate(1px, -1px) skew(1deg); }
        100% { transform: translate(0) skew(0deg); }
      }
      @keyframes glitch-flicker {
        0% { opacity: 0.98; }
        25% { opacity: 0.85; }
        50% { opacity: 0.98; }
        75% { opacity: 0.75; }
        100% { opacity: 0.98; }
      }
      @keyframes glitch-blur {
        0% { transform: translateY(-100%) scaleY(1); opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { transform: translateY(150%) scaleY(0.5); opacity: 0.1; }
      }

      /* Premium Cosmetics Custom Animations */
      @keyframes matrix-char-print {
        0%, 100% { opacity: 0; color: #064e3b; }
        1% { opacity: 1; color: #ffffff; }
        15% { opacity: 0.9; color: #34d399; }
        60% { opacity: 0.3; color: #064e3b; }
      }
      @keyframes matrix-char-print-dim {
        0%, 100% { opacity: 0; color: #064e3b; }
        1% { opacity: 0.8; color: #6ee7b7; }
        20% { opacity: 0.3; color: #059669; }
        60% { opacity: 0.1; color: #064e3b; }
      }
      @keyframes matrix-column-scrolling {
        0% { transform: translate3d(0, -50%, 0); }
        100% { transform: translate3d(0, 0%, 0); }
      }
      @keyframes matrix-rain-flow {
        0% { background-position: 0% -180%; }
        65% { background-position: 0% 120%; }
        100% { background-position: 0% 120%; }
      }
      @keyframes glitch-pop-anim {
        0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0, 0) scale(1); }
        8% { clip-path: inset(12% 0 55% 0); transform: translate(-4px, 3px) scale(0.98); }
        15% { clip-path: inset(45% 0 15% 0); transform: translate(3px, -2px) scale(1.02); }
        22% { clip-path: inset(0 45% 35% 0); transform: translate(0px, 0px) scale(1); }
        30% { clip-path: inset(60% 0 5% 0); transform: translate(-3px, -3px) scale(0.96); }
        36% { clip-path: inset(15% 55% 45% 0); transform: translate(4px, 2px) scale(1); }
        45% { clip-path: inset(0 0 0 0); transform: translate(0, 0) scale(1); }
      }
      @keyframes fire-rise-anim {
        0% { transform: translateY(45%) scale(0.7) rotate(0deg); opacity: 0; }
        15% { opacity: 0.9; }
        50% { transform: translateY(5%) scale(1.1) rotate(6deg); opacity: 0.85; }
        80% { opacity: 0.4; }
        100% { transform: translateY(-55%) scale(1.3) rotate(-12deg); opacity: 0; }
      }
      @keyframes fire-sway-anim {
        0%, 100% { transform: translateX(0) scaleX(1); }
        50% { transform: translateX(5px) scaleX(0.9); }
      }
      @keyframes cosmic-swirl-anim {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes star-twinkle-anim {
        0%, 100% { opacity: 0.15; transform: scale(0.7); }
        50% { opacity: 0.9; transform: scale(1.1); }
      }
      @keyframes circuit-pulse-anim {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.95; }
      }
      @keyframes gold-shimmer-anim {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      /* Beach theme animations */
      @keyframes beach-palm-sway {
        0%, 100% { transform: rotate(-1deg); }
        50% { transform: rotate(5deg); }
      }
      @keyframes beach-wave-one {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(-3px) scaleY(1.1); }
      }
      @keyframes beach-wave-two {
        0%, 100% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(-4px) scaleY(1.05); }
      }
      @keyframes beach-wave-foam {
        0%, 100% { transform: translateY(0) scaleX(1); opacity: 0.6; }
        50% { transform: translateY(-2.5px) scaleX(1.04); opacity: 0.95; }
      }
      @keyframes beach-cloud-move {
        0% { transform: translateX(-35px); }
        100% { transform: translateX(130px); }
      }
      @keyframes tide-animation {
        0%, 100% { transform: translateY(-16%) rotate(0.5deg); }
        50% { transform: translateY(18%) rotate(-0.5deg); }
      }
      @keyframes water-glitter-anim {
        0%, 100% {
          transform: scale(0.3) rotate(0deg);
          opacity: 0;
        }
        50% {
          transform: scale(1.1) rotate(180deg);
          opacity: 0.95;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "path": "https://esm.sh/path@^0.12.7",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900 text-slate-100 overflow-hidden">
    <svg width="0" height="0" style="position: absolute; pointer-events: none;">
      <filter id="sumie-ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.2" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
        <feGaussianBlur in="displaced" stdDeviation="0.4" result="blurred" />
        <feComponentTransfer in="blurred">
          <feFuncA type="linear" slope="4" intercept="-1.5" />
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
